# OpenFarm headless engine for AgroMind, managed as a Coolify Docker Compose
# resource. Builds from THIS repository (services/api, services/tiler), so the
# deployed engine is always a commit of the fork, never the old upstream.
#
# Runbook: capobiancom/OpenFarm-Deploy (README). Variables: .env.example here.
#
# Persistence: Coolify renames every named volume to "<resource-uuid>_<name>"
# (bootstrap/helpers/parsers.php in Coolify 4.0.0-beta.455) and ignores
# `external: true` on volumes. A new resource therefore starts with EMPTY
# volumes. Existing data must be copied into <uuid>_pgdata / _redisdata /
# _miniodata while the resource is stopped, BEFORE the first start, because the
# api runs `alembic upgrade head` on boot and would silently initialise an
# empty database.
#
# Networking:
# - `default` is the resource's private network. db, redis, minio and the
#   processor live only there.
# - Internal hostnames are unique (openfarm-db, openfarm-redis, openfarm-minio):
#   api and tiler also join the shared `coolify` network, where short names like
#   `redis` already resolve to other containers (Coolify's own Redis).
# - api and tiler join the external `coolify` network with stable aliases
#   (${OPENFARM_NETWORK_ALIAS}-api / -tiler) so the AgroMind backend, which can
#   only live on `coolify`, reaches them after any redeploy of either side.
#   Whether Coolify preserves this external network exactly as declared is
#   still UNVERIFIED and must be confirmed in the isolated rehearsal (phase M1).
# - No service publishes ports.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases: [openfarm-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    # maxmemory below the container limit: with noeviction Redis answers OOM
    # errors instead of being killed by the kernel.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks:
      default:
        aliases: [openfarm-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    mem_limit: 384m
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - miniodata:/data
    networks:
      default:
        aliases: [openfarm-minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      # psycopg2 driver is required: SQLAlchemy 2.1 defaults to psycopg3,
      # which is not installed, and alembic fails on boot.
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?required}
      REDIS_URL: ${REDIS_URL:?required}
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET:?required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-openfarm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TITILER_PUBLIC_URL: ${TITILER_PUBLIC_URL:-http://tiler}
      STAC_API_URL: ${STAC_API_URL:-https://earth-search.aws.element84.com/v1}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      default: {}
      coolify:
        aliases: ["${OPENFARM_NETWORK_ALIAS:?required}-api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  processor:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    command: celery -A app.worker worker -Q default,celery --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?required}
      REDIS_URL: ${REDIS_URL:?required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-openfarm}
      STAC_API_URL: ${STAC_API_URL:-https://earth-search.aws.element84.com/v1}
      SOILGRIDS_WCS_BASE_URL: ${SOILGRIDS_WCS_BASE_URL:-}
      POLARIS_S3_BUCKET: ${POLARIS_S3_BUCKET:-}
      SOIL_FETCH_TIMEOUT_SECONDS: ${SOIL_FETCH_TIMEOUT_SECONDS:-}
      SOIL_SOURCE_PRIORITY: ${SOIL_SOURCE_PRIORITY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      default: {}
    # Proposed: the worker answers a Celery ping. Generous timings, the ping
    # only needs the broker and the local worker process.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  tiler:
    build:
      context: ../../services/tiler
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    environment:
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET:?required}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?required}
      AWS_S3_ENDPOINT: ${MINIO_ENDPOINT:?required}
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      TITILER_API_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      minio: { condition: service_healthy }
    networks:
      default: {}
      coolify:
        aliases: ["${OPENFARM_NETWORK_ALIAS:?required}-tiler"]
    # Proposed: same /healthz the AgroMind backend already checks.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}

networks:
  coolify:
    external: true
